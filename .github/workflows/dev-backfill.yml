name: Dev Backfill


on:
  push:
    branches: [dev]

  workflow_dispatch:
    branches: [dev]

permissions:
  contents: read
  id-token: write

env:
  INSTANCE_NAME: data-fetcher-dev
  APP_DIR: /opt/fansboda-finance
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  spin-up-vm:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Remove stale dev VM if present
        env:
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud compute instances delete "$INSTANCE_NAME" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --quiet 2>/dev/null || true

      - name: Create ephemeral dev VM
        env:
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          gcloud compute instances create "$INSTANCE_NAME" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --machine-type=e2-micro \
            --image-family=debian-12 \
            --image-project=debian-cloud \
            --metadata-from-file=startup-script=scripts/bootstrap-dev-vm.sh \
            --service-account="$GCP_DEPLOY_SERVICE_ACCOUNT" \
            --scopes=https://www.googleapis.com/auth/cloud-platform \
            --tags=dev-backfill

      - name: Wait for bootstrap to finish
        env:
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          for attempt in $(seq 1 36); do
            if gcloud compute ssh "$INSTANCE_NAME" \
              --zone="$GCP_ZONE" \
              --project="$GCP_PROJECT_ID" \
              --quiet \
              --tunnel-through-iap \
              --command="test -f /var/run/fansboda-dev-bootstrap.done"; then
              echo "Bootstrap ready after attempt $attempt"
              exit 0
            fi
            echo "Waiting for bootstrap (attempt $attempt/36)..."
            sleep 10
          done
          echo "Timed out waiting for dev VM bootstrap" >&2
          exit 1

  deploy:
    needs: spin-up-vm
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy latest code to dev VM and install dependencies
        env:
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          tar czf /tmp/fansboda-finance.tgz \
            --exclude='./.git' \
            --exclude='./.venv' \
            --exclude='./.pytest_cache' \
            -C "$GITHUB_WORKSPACE" .
          gcloud compute scp /tmp/fansboda-finance.tgz \
            "$INSTANCE_NAME:/tmp/fansboda-finance.tgz" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --quiet \
            --tunnel-through-iap
          gcloud compute ssh "$INSTANCE_NAME" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --quiet \
            --tunnel-through-iap \
            --command="sudo mkdir -p $APP_DIR && sudo tar xzf /tmp/fansboda-finance.tgz -C $APP_DIR && sudo rm -f /tmp/fansboda-finance.tgz && sudo chown -R fansboda:fansboda $APP_DIR && sudo -u fansboda bash -c 'cd $APP_DIR && PIPENV_VENV_IN_PROJECT=1 pipenv install --deploy'"
          rm -f /tmp/fansboda-finance.tgz

      - name: Write .env on dev VM
        env:
          DATABASE_URL_DEV: ${{ secrets.DATABASE_URL }}
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set +x
          printf 'DATABASE_URL=%s\nAPP_ENV=dev\n' "$DATABASE_URL_DEV" > .env.tmp
          gcloud compute scp .env.tmp "$INSTANCE_NAME:/tmp/.env.tmp" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --quiet \
            --tunnel-through-iap
          rm -f .env.tmp
          gcloud compute ssh "$INSTANCE_NAME" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --quiet \
            --tunnel-through-iap \
            --command="sudo install -o fansboda -g fansboda -m 600 /tmp/.env.tmp $APP_DIR/.env && rm -f /tmp/.env.tmp"

  collect-data:
    needs: deploy
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Seed tickers and run backfill
        env:
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud compute ssh "$INSTANCE_NAME" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --quiet \
            --tunnel-through-iap \
            --command="sudo -u fansboda bash -c 'cd $APP_DIR && set -a && . ./.env && set +a && PIPENV_VENV_IN_PROJECT=1 pipenv run python seed_tickers.py && PIPENV_VENV_IN_PROJECT=1 pipenv run python backfill_sma.py'" \
            2>&1 | tee collect-data.log

      - uses: actions/upload-artifact@v4
        with:
          name: collect-data-log
          path: collect-data.log

  verify:
    needs: collect-data
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collect-data-log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Verify backfill log and dev database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/verify_dev_backfill.py collect-data.log

  delete-vm:
    needs: [spin-up-vm, deploy, collect-data, verify]
    if: always() && needs.spin-up-vm.result != 'skipped'
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete ephemeral dev VM
        env:
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud compute instances delete "$INSTANCE_NAME" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --quiet || true
