name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Copy code to VM and install dependencies
        env:
          GCP_INSTANCE_NAME: ${{ secrets.GCP_INSTANCE_NAME }}
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          tar czf /tmp/fansboda-finance.tgz \
            --exclude='./.git' \
            --exclude='./.venv' \
            --exclude='./.pytest_cache' \
            -C "$GITHUB_WORKSPACE" .
          gcloud compute scp /tmp/fansboda-finance.tgz \
            "$GCP_INSTANCE_NAME:/tmp/fansboda-finance.tgz" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID"
          gcloud compute ssh "$GCP_INSTANCE_NAME" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --command="sudo mkdir -p /opt/fansboda-finance && sudo tar xzf /tmp/fansboda-finance.tgz -C /opt/fansboda-finance && sudo rm -f /tmp/fansboda-finance.tgz && sudo chown -R fansboda:fansboda /opt/fansboda-finance && sudo -u fansboda bash -c 'cd /opt/fansboda-finance && PIPENV_VENV_IN_PROJECT=1 pipenv install --deploy'"
          rm -f /tmp/fansboda-finance.tgz

      - name: Write .env on VM
        env:
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL }}
          GCP_INSTANCE_NAME: ${{ secrets.GCP_INSTANCE_NAME }}
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set +x
          printf 'DATABASE_URL=%s\nAPP_ENV=production\n' "$DATABASE_URL_PROD" > .env.tmp
          gcloud compute scp .env.tmp "$GCP_INSTANCE_NAME:/opt/fansboda-finance/.env" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID"
          rm -f .env.tmp
          gcloud compute ssh "$GCP_INSTANCE_NAME" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --command="sudo chown fansboda:fansboda /opt/fansboda-finance/.env && sudo chmod 600 /opt/fansboda-finance/.env"
